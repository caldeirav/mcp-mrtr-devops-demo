# yaml-language-server: $schema=https://agentgateway.dev/schema/config
# Contract: specs/002-gateway-llm-tracing — mirror to repo-root agentgateway.yaml
# Constitution: statefulMode MUST remain stateless (no Mcp-Session-Id pinning).
# Validate: agentgateway -f agentgateway.yaml --validate-only
#
# Env: OPENAI_API_KEY (and preferably MODEL_NAME aligned with params.model)
# Admin UI: http://localhost:15000/ui/
# Jaeger UI: http://localhost:16686  (OTLP gRPC: localhost:4317)

frontendPolicies:
  tracing:
    host: localhost:4317
    randomSampling: true

llm:
  models:
  - name: "*"
    provider:
      custom:
        formats:
        - type: completions
    params:
      apiKey: $OPENAI_API_KEY
      model: qwen/qwen3.6-35b-a3b
      baseUrl: http://127.0.0.1:1234/v1

mcp:
  port: 8080
  statefulMode: stateless
  targets:
  - name: devops-migration
    mcp:
      host: http://127.0.0.1:8000/mcp
  policies:
    cors:
      allowOrigins:
      - http://localhost:15000
      allowHeaders:
      - '*'
      allowMethods:
      - GET
      - POST
