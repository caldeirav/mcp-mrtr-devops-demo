[project]
name = "mcp-mrtr-devops-demo"
version = "0.1.0"
description = "Stateless MCP SEP-2322 MRTR DevOps migration HITL demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4.0",
    "langchain-openai>=0.3.0",
    "httpx>=0.28.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server", "agent"]
