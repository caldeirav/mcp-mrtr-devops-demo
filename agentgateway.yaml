# yaml-language-server: $schema=https://agentgateway.dev/schema/config
mcp:
  port: 8080
  statefulMode: stateless
  targets:
  - name: devops-migration
    mcp:
      host: http://127.0.0.1:8000/mcp
  policies:
    cors:
      allowOrigins:
      - http://localhost:15000
      allowHeaders:
      - '*'
      allowMethods:
      - GET
      - POST
      exposeHeaders:
      - Mcp-Session-Id
